<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#07192F" />
    <title>Offline — OptiVision</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial,
          "Apple Color Emoji", "Segoe UI Emoji";
        background: #f0f5fa;
        color: #07192f;
      }
      .wrap {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .card {
        width: min(560px, 100%);
        border-radius: 16px;
        background: white;
        border: 1px solid rgba(7, 25, 47, 0.12);
        box-shadow: 0 12px 36px rgba(7, 25, 47, 0.08);
        padding: 20px 18px;
      }
      h1 {
        margin: 0;
        font-size: 18px;
        letter-spacing: -0.01em;
      }
      p {
        margin: 10px 0 0;
        color: rgba(7, 25, 47, 0.8);
        line-height: 1.45;
        font-size: 14px;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 14px;
        font-weight: 700;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: rgba(7, 25, 47, 0.8);
        border: 1px solid rgba(7, 25, 47, 0.14);
        background: rgba(7, 25, 47, 0.04);
        padding: 8px 10px;
        border-radius: 999px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h1>You are offline</h1>
        <p>
          OptiVision can continue collecting data offline. Your screening session and test results
          will sync automatically when you reconnect.
        </p>
        <div class="pill">Offline — data will sync when reconnected</div>
      </div>
    </div>
  </body>
</html>
