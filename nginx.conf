# HTTP :80 + HTTPS :443 — same app; /api proxied to FastAPI (avoids mixed content when using HTTPS locally).
upstream ambyo_api {
    server backend:8001;
}

server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access_http.log combined;
    error_log  /var/log/nginx/error_http.log warn;
    root /usr/share/nginx/html;
    index index.html;

    location = /favicon.ico {
        return 302 /icon-192.svg;
    }

    location /api/ {
        client_max_body_size 25m;
        proxy_pass http://ambyo_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}

server {
    listen 443 ssl;
    server_name _;
    access_log /var/log/nginx/access_https.log combined;
    error_log  /var/log/nginx/error_https.log warn;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate     /etc/nginx/ssl/self.crt;
    ssl_certificate_key /etc/nginx/ssl/self.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location = /favicon.ico {
        return 302 /icon-192.svg;
    }

    location /api/ {
        client_max_body_size 25m;
        proxy_pass http://ambyo_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
