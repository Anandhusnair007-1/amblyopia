# Production — https://optivision.me (and www)
upstream ambyo_api {
    server backend:8001;
}

server {
    listen 80;
    server_name optivision.me www.optivision.me;
    access_log /var/log/nginx/access_http.log combined;
    error_log  /var/log/nginx/error_http.log warn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name optivision.me www.optivision.me;
    access_log /var/log/nginx/access_https.log combined;
    error_log  /var/log/nginx/error_https.log warn;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

    root /usr/share/nginx/html;
    index index.html;

    location = /favicon.ico {
        return 302 /icon-192.svg;
    }

    location /api/ {
        client_max_body_size 25m;
        proxy_pass http://ambyo_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
