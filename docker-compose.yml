# Local pilot / demo stack — NOT for exposing MongoDB to the public internet without TLS + auth.
#
# Setup:
#   cp backend/.env.production.example backend/.env
#   Edit backend/.env (secrets, CORS_ORIGINS matching how users reach the UI).
#   docker compose up --build
#
# Frontend: default empty REACT_APP_BACKEND_URL → SPA calls same-origin /api (nginx proxies to backend).
# Open http://localhost:8080  OR  https://localhost:8443 (self-signed cert — click Advanced → proceed once).
# If Chrome shows ERR_SSL_PROTOCOL_ERROR on :8080, you are using https:// on the HTTP port — use http:// or :8443.
#
# Public VPS (ambyoai.com): copy compose.env.example → .env and set FRONTEND_HTTP_HOST=0.0.0.0, FRONTEND_HTTP_PORT=80,
# FRONTEND_HTTPS_HOST=0.0.0.0, FRONTEND_HTTPS_PORT=443, then use docker-compose.production.yml for TLS mounts.
#
# Logs on the host (see logs/README.md):
#   ./logs/mongo/mongod.log   — MongoDB (file)
#   ./logs/backend/backend.log — API (when LOG_DIR=/app/logs)
#   ./logs/nginx/*.log        — Nginx access / error
# Snapshot all container stdout:  bash scripts/save_stack_logs.sh

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
      - ./logs/mongo:/var/log/mongodb
    command: ["--bind_ip_all"]
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    # Dev/demo only — for production use Atlas or Mongo with authentication + TLS (see docs).
    ports:
      - "127.0.0.1:27017:27017"
    networks:
      - ambyoai

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      LOG_DIR: /app/logs
      # Override via `.env` next to this file (see compose.env.example) or set in backend/.env
      AMBYO_STRABISMUS_MODEL: ${AMBYO_STRABISMUS_MODEL:-/app/models/strabismus_model.keras}
    volumes:
      - ./logs/backend:/app/logs
      - ./backend/models:/app/models:ro
    # Copy backend/.env.production.example → backend/.env before first run.
    env_file:
      - backend/.env
    depends_on:
      - mongo
    networks:
      - ambyoai
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        REACT_APP_BACKEND_URL: ${REACT_APP_BACKEND_URL:-}
    restart: unless-stopped
    ports:
      - "${FRONTEND_HTTP_HOST:-127.0.0.1}:${FRONTEND_HTTP_PORT:-8080}:80"
      - "${FRONTEND_HTTPS_HOST:-127.0.0.1}:${FRONTEND_HTTPS_PORT:-8443}:443"
    volumes:
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - backend
    networks:
      - ambyoai
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  mongo_data:

networks:
  ambyoai:
    driver: bridge
